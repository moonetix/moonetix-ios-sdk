name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  token-endpoint:
    name: Token endpoint (Node 22, PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token-endpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm test
      - run: php -l token-endpoint.php
